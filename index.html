<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf6ee">
<title>HSK จีนเรียนสนุก · แฟลชการ์ด พูด เขียน เชื่อมโยง</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HSK จีน">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.2/dist/hanzi-writer.min.js"></script>
<style>
:root{
  --paper:#faf6ee; --card:#fffdf9; --ink:#24201c; --muted:#6f675d; --line:#ebe2d3;
  --red:#c8322b; --red-2:#a8241f; --red-soft:#fbe6e2;
  --jade:#1f8a5b; --jade-soft:#e2f2ea; --grid:#3aa76d; --grid-dash:#8fd0ad;
  --gold:#e0a13a; --gold-soft:#fbefd8;
  --t1:#e03131; --t2:#2b9348; --t3:#1c7ed6; --t4:#9c36b5; --t5:#868e96;
  --r:18px; --shadow:0 1px 0 rgba(36,32,28,.04),0 8px 22px -14px rgba(36,32,28,.35);
  --f-body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --f-han:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-head:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
body{min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--f-head);line-height:1.25;margin:0}
p{margin:0 0 .8em}
.han{font-family:var(--f-han);font-weight:700}
.app{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px)}
.hide{display:none!important}
.muted{color:var(--muted)} .small{font-size:14px} .center{text-align:center} .mt{margin-top:14px}

/* top */
.top{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:6px;padding:10px 14px;background:rgba(250,246,238,.95);backdrop-filter:blur(6px);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top .ttl{flex:1;font-family:var(--f-head);font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{flex:1;display:flex;align-items:center;gap:9px;font-family:var(--f-head);font-weight:700;font-size:17px}
.seal{width:34px;height:34px;border-radius:9px;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--f-han);font-size:19px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;border-radius:12px}
.ibtn:active{background:var(--line)} .ibtn svg{width:22px;height:22px}
.view{padding:6px 16px 0;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11.5px;color:var(--muted);font-weight:500}
.nav button .ni{font-family:var(--f-han);font-size:20px;line-height:1.1;font-weight:700}
.nav button.on{color:var(--red)}
.nbadge{position:absolute;top:8px;left:calc(50% + 8px);width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--card)}

/* headings */
.uhead{padding:6px 0 2px}
.eyebrow{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.uhead .eyebrow{color:var(--red)}
.uhead h1{font-size:25px;margin:2px 0}
.uhead p{color:var(--muted);margin:0}
.sec{margin:24px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h2{font-size:18.5px}

/* cards & rows */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.rows{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;border:0;background:none;text-align:left;border-bottom:1px solid var(--line);min-height:58px}
.row:last-child{border-bottom:0} .row:active{background:var(--paper)}
.row .tx{flex:1;min-width:0} .row .tx b{display:block;font-weight:600} .row .tx span{display:block;font-size:13.5px;color:var(--muted)}
.chev{width:18px;height:18px;color:var(--muted);flex:none}
.ico{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:21px;background:var(--paper)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:1px solid transparent;font-weight:600;font-size:15.5px;background:var(--red);color:#fff;width:100%;text-decoration:none}
.btn:active{transform:translateY(1px)} .btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.jade{background:var(--jade)} .btn.gold{background:var(--gold);color:#2b1d03}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:grid;gap:10px;margin-top:16px} .btns.two{grid-template-columns:1fr 1fr} .btns.three{grid-template-columns:1fr 1fr 1fr}
.chip{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none} .chips::-webkit-scrollbar{display:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;border-radius:11px;min-height:40px;background:transparent;font-weight:600;font-size:14px}
.seg button.on{background:var(--card);box-shadow:var(--shadow);color:var(--red)}

/* pinyin tones */
.py{font-weight:500;letter-spacing:.01em}
.py .t1{color:var(--t1)} .py .t2{color:var(--t2)} .py .t3{color:var(--t3)} .py .t4{color:var(--t4)} .py .t5{color:var(--t5)}

/* home */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px;background:linear-gradient(160deg,#c8322b,#9e1f1a);color:#fff3ea}
.hero .bg{position:absolute;right:-8px;top:-26px;font-family:var(--f-han);font-size:150px;line-height:1;color:rgba(255,255,255,.09);font-weight:900;pointer-events:none}
.hero .hi{font-size:14.5px;opacity:.9}
.hero h1{font-size:24px;color:#fff;margin:2px 0 12px}
.hero .lvsel{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px}
.hero .bar{margin-top:14px;height:8px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .6s}
.hero .meta{display:flex;justify-content:space-between;font-size:13px;margin-top:6px;opacity:.92}
.cont{display:flex;align-items:center;gap:14px;margin-top:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.cont .n{width:52px;height:52px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--red-soft);color:var(--red);font-family:var(--f-han);font-size:26px;font-weight:700}
.cont .tx{flex:1;min-width:0} .cont .tx b{display:block;font-family:var(--f-head);font-size:16px} .cont .tx span{font-size:13.5px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{font-family:var(--f-head);font-size:22px;display:block;line-height:1.1} .stat span{font-size:12.5px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-height:118px}
.tile .tg{font-family:var(--f-han);font-size:30px;font-weight:700;line-height:1;color:var(--red)}
.tile b{font-family:var(--f-head);font-size:15.5px} .tile span{font-size:13px;color:var(--muted);line-height:1.4}
.streak{display:flex;gap:12px;align-items:center;margin-top:12px;padding:12px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}
.streak .fl{font-size:24px} .streak b{display:block;font-family:var(--f-head)} .streak span{font-size:13.5px;color:var(--muted)}
.streak.risk{background:#fdeee6;border-color:#f2c9b5} .streak.ok{background:var(--jade-soft);border-color:#c7e6d5}

/* sets grid */
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.setc{position:relative;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:10px 8px 8px;text-align:center;box-shadow:var(--shadow);min-height:92px}
.setc .no{font-size:11.5px;color:var(--muted);font-weight:600}
.setc .hz{font-family:var(--f-han);font-weight:700;font-size:20px;line-height:1.3;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setc .pb{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px} .setc .pb i{display:block;height:100%;background:var(--jade)}
.setc.done{background:var(--jade-soft);border-color:#c7e6d5} .setc.done::after{content:"✓";position:absolute;top:6px;right:8px;color:var(--jade);font-weight:800}
.setc.cur{outline:2px solid var(--red);outline-offset:1px}

/* word list */
.wl{display:grid;gap:8px}
.wi{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.wi .hz{font-family:var(--f-han);font-weight:700;font-size:24px;min-width:64px}
.wi .tx{flex:1;min-width:0} .wi .tx .th{display:block;font-size:14.5px;line-height:1.35}
.wi .k{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none} .wi .k.k1{background:var(--gold)} .wi .k.k2{background:var(--jade)}
.say{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--red)}
.say svg{width:19px;height:19px} .say.playing{background:var(--red);color:#fff;border-color:var(--red)}
.say.sm{width:34px;height:34px} .say.sm svg{width:16px;height:16px}

/* flashcard */
.fc-top{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.track{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden} .track i{display:block;height:100%;background:var(--red);transition:width .3s}
.fc-wrap{perspective:1200px}
.fc{position:relative;height:min(62vh,420px);transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center}
.fc .back{transform:rotateY(180deg)}
.fc .big{font-family:var(--f-han);font-weight:700;line-height:1.1;color:var(--ink)}
.fc .hint{position:absolute;bottom:14px;font-size:12.5px;color:var(--muted)}
.fc .tag{position:absolute;top:14px;left:16px;font-size:12px;color:var(--muted)}
.fc .face .say{position:absolute;top:10px;right:10px}
.fc .bpy{font-size:24px;margin:8px 0 4px} .fc .bth{font-size:20px;font-weight:600;line-height:1.4} .fc .ben{font-size:13.5px;color:var(--muted);margin-top:6px}
.parts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.part{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:4px 12px 4px 6px;font-size:13.5px}
.part .ph{font-family:var(--f-han);font-weight:700;font-size:18px;color:var(--red)}
@media (prefers-reduced-motion:reduce){.fc{transition:none}}

/* quiz */
.qbig{text-align:center;margin:8px 0 16px}
.qbig .han{font-size:56px;line-height:1.2}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;min-height:54px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:16px;line-height:1.35}
.opt .han{font-size:24px}
.opt.right{border-color:var(--jade);background:var(--jade-soft)} .opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt[disabled]{cursor:default}
.explain{margin-top:12px;font-size:14.5px;padding:10px 12px;border-radius:12px;background:var(--paper)}
.result{text-align:center;padding:18px 8px}
.ring{width:140px;height:140px;margin:0 auto 10px;position:relative} .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-head)} .ring .v b{font-size:34px}

/* speaking */
.sp-card{text-align:center;padding:22px 16px}
.sp-zh{font-family:var(--f-han);font-weight:700;line-height:1.3;margin:6px 0}
.sp-zh .ok{color:var(--jade)} .sp-zh .miss{color:var(--red);text-decoration:underline wavy rgba(200,50,43,.5);text-underline-offset:6px}
.sp-py{font-size:18px;margin-bottom:2px} .sp-th{color:var(--muted)}
.sp-ctrl{display:flex;align-items:center;justify-content:center;gap:18px;margin:18px 0 6px}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -10px rgba(200,50,43,.7)}
.mic svg{width:36px;height:36px} .mic.live{animation:pulse 1.1s infinite;background:#e03131}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,49,49,.5)}70%{box-shadow:0 0 0 18px rgba(224,49,49,0)}100%{box-shadow:0 0 0 0 rgba(224,49,49,0)}}
.round{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--red)}
.round svg{width:24px;height:24px} .round.playing{background:var(--red);color:#fff}
.sp-res{margin-top:12px;padding:12px;border-radius:14px;background:var(--paper)}
.stars{font-size:24px;letter-spacing:2px}
.heard{font-family:var(--f-han);font-size:18px}
.note{font-size:13.5px;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:12px}
.warnbox{background:var(--gold-soft);border-color:#ecd3a1;color:#5b4210}

/* sentences */
.sent{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line)}
.sent:last-child{border-bottom:0}
.sent .tx{flex:1} .sent .zh{font-family:var(--f-han);font-size:20px;font-weight:700;line-height:1.4}
.sent .spy{font-size:14px;color:var(--red-2)} .sent .sth{font-size:14px;color:var(--muted)}

/* writing grid (田字格) */
.sheet{background:#fff;border-radius:14px;padding:10px;border:1px solid var(--line);box-shadow:var(--shadow)}
.wrow{display:grid;grid-template-columns:repeat(var(--cols,8),1fr);gap:0;margin-bottom:8px;cursor:pointer}
.cell{position:relative;aspect-ratio:1/1;border:1.6px solid var(--grid);margin-left:-1.6px;background:#fff}
.cell:first-child{margin-left:0}
.cell svg{position:absolute;inset:0;width:100%;height:100%}
.wrow:active .cell{background:#f6fbf8}
.wrow .lbl{display:none}
.wcap{display:flex;align-items:center;gap:8px;margin:2px 0 4px;font-size:13px;color:var(--muted)}
.wcap .han{font-size:15px;color:var(--ink)}
.hw-box{width:min(78vw,320px);height:min(78vw,320px);margin:0 auto;position:relative;background:#fff;border:2px solid var(--grid);border-radius:6px}
.hw-box>svg.guide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hw-box>div{position:absolute;inset:0}
.wmeta{display:flex;justify-content:center;gap:14px;align-items:baseline;margin:10px 0}
.wmeta .han{font-size:30px}
.wstat{text-align:center;font-weight:600;min-height:24px;margin-top:8px}

/* links (เชื่อมโยง) */
.search{display:flex;gap:8px}
.search input{flex:1;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card)}
.search input:focus{outline:2px solid var(--red);border-color:transparent}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.cg{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 4px;text-align:center}
.cg .han{display:block;font-size:28px;line-height:1.2} .cg span{font-size:11.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fam{padding:18px}
.fam-h{display:flex;align-items:center;gap:14px}
.fam-h .big{font-family:var(--f-han);font-weight:700;font-size:64px;line-height:1;color:var(--red);width:84px;height:84px;display:grid;place-items:center;background:var(--red-soft);border-radius:20px;flex:none}
.fam-h .mean{font-size:19px;font-weight:600} .fam-h .em{font-size:28px}
.fam-list{margin-top:14px;display:grid;gap:8px}
.fl{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--paper)}
.fl .arrow{color:var(--red);font-weight:700;padding-top:3px}
.fl .tx{flex:1;min-width:0}
.fl .w{font-family:var(--f-han);font-weight:700;font-size:22px}
.fl .eq{font-size:15px;line-height:1.5}
.fl .bd{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.bdc{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:1px 10px;font-size:13px}
.bdc .han{font-size:15px;margin-right:3px;color:var(--red)}
.bdc.self{background:var(--red-soft);border-color:#f2c3bd}

/* modal sheet */
.modal{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(36,32,28,.42);animation:fade .18s}
.modal .sheet2{width:100%;max-width:600px;max-height:92vh;overflow:auto;background:var(--paper);border-radius:24px 24px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom))}
.modal .grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 8px}
.modal .mh{display:flex;align-items:center;gap:8px;margin-bottom:8px} .modal .mh b{flex:1;font-family:var(--f-head);font-size:17px}

/* forms */
input[type=text],select,textarea{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--card);color:var(--ink)}
label.lb{display:block;font-weight:600;font-size:14.5px;margin:14px 0 6px}
.switch{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.switch input{width:22px;height:22px;accent-color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:40;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{text-align:center;padding:40px 10px;color:var(--muted)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;margin:0 auto 10px;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* print: only the worksheet */
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff}
  .top,.nav,.toast,.noprint,.uhead,.sec,.note,.btns,.chips,.modal{display:none!important}
  .app{max-width:none;padding:0}
  .view{padding:0;animation:none}
  .sheet{border:0;box-shadow:none;padding:0}
  .wrow{--cols:12!important;break-inside:avoid;margin-bottom:5mm}
  .wcap{display:none}
}

.insbar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 8px 10px 12px;margin:0 0 12px;box-shadow:0 6px 18px -12px rgba(36,32,28,.35)}
.insbar b{display:block;font-size:15px}.insbar span{font-size:12.5px;color:var(--muted)}
.insbar .ibtn{width:36px;height:36px;font-size:14px;color:var(--muted)}
@media (display-mode: standalone){.top{padding-top:calc(12px + env(safe-area-inset-top))}}

    return String(lv || '').split(' ').filter(Boolean).map(function (x) { return (x[0] === 't' ? 'HSK 3.0 ระดับ ' : 'HSK 2.0 ระดับ ') + (x[0] === 't' && x[1] === '7' ? '7–9' : x[1]); }).join(' · ');
  }

  V.links = function (el) {
    var R = A.R;
    if (R.c) return detail(el, R.c, R.trail || []);
    A.top();
    A.loading(el, 'กำลังโหลดตัวอักษร…');
    Promise.all([A.loadFam(), A.loadLevel(A.S.sys, A.curLv())]).then(function (r) {

      words.forEach(function (w) { Array.from(w.h).forEach(function (c) { var f = F[c]; if (f && !seen[c] && f.comps.length && (' ' + f.lv + ' ').indexOf(' ' + key + ' ') >= 0) { seen[c] = 1; list.push(f); } }); });
      list.sort(function (a, b) { return (b.em ? 1 : 0) - (a.em ? 1 : 0) || b.comps.length - a.comps.length; });
      el.innerHTML = '<div class="uhead"><div class="eyebrow">เรียนแบบเชื่อมโยง · 联想</div><h1>รู้ 1 ตัว ต่อยอดได้หลายคำ</h1><p>เช่น <span class="han">火</span> ไฟ 🔥 → <span class="han">火车</span> รถไฟ (ไฟ + รถ) · <span class="han">火山</span> ภูเขาไฟ (ไฟ + ภูเขา)</p></div>' +
        '<div class="search mt"><input type="text" id="l-q" placeholder="ค้นหา: ตัวจีน / pinyin / คำไทย เช่น 火, shui, ไฟ"><button class="btn" id="l-go" style="width:auto">ค้นหา</button></div>' +
        '<div id="l-res"></div>' +
        '<div class="sec"><h2>ตัวอักษรใหม่ใน ' + A.lvName(A.S.sys, A.curLv()) + '</h2><button class="chip" id="l-lv">เปลี่ยนระดับ</button></div>' +
        (list.length ? '<div class="cgrid">' + list.map(function (f) { return '<button class="cg" data-c="' + esc(f.c) + '"><span class="han">' + esc(f.c) + '</span><span>' + (f.em ? f.em + ' ' : '') + esc(g1(f)) + '</span></button>'; }).join('') + '</div>' : '<div class="note">ระดับนี้ไม่มีตัวอักษรใหม่ที่มีคำต่อยอด</div>');
      function bind(root) { $$('.cg', root).forEach(function (b) { b.onclick = function () { A.go('links', { c: b.dataset.c }); }; }); }
      bind(el);
      $('#l-lv').onclick = A.levelPicker;
      function search() {
        var q = $('#l-q').value.trim(), out = [], qs;
        if (!q) { $('#l-res').innerHTML = ''; return; }
        var hz = Array.from(q).filter(function (c) { return /[\u4e00-\u9fff]/.test(c); });
        if (hz.length === 1) { A.go('links', { c: hz[0] }); return; }
        if (hz.length) out = hz.map(function (c) { return F[c]; }).filter(Boolean);
        else {
          qs = toneless(q);
          var th = /[\u0E00-\u0E7F]/.test(q);
          Object.keys(F).forEach(function (c) { var f = F[c]; if (out.length > 60) return; if (th ? f.t.indexOf(q) >= 0 : (qs && toneless(f.p) === qs)) out.push(f); });
          if (!th && qs && out.length < 8) Object.keys(F).forEach(function (c) { var f = F[c]; if (out.length > 60 || out.indexOf(f) >= 0) return; if (toneless(f.p).indexOf(qs) === 0) out.push(f); });
        }
        $('#l-res').innerHTML = '<div class="sec"><h2>ผลการค้นหา</h2><span class="small muted">' + out.length + ' ตัว</span></div>' +
          (out.length ? '<div class="cgrid">' + out.map(function (f) { return '<button class="cg" data-c="' + esc(f.c) + '"><span class="han">' + esc(f.c) + '</span><span>' + A.pyHtml(f.p) + '</span><span>' + esc(g1(f)) + '</span></button>'; }).join('') + '</div>' : '<div class="note">ไม่พบ ลองพิมพ์ตัวจีน 1 ตัว</div>');
        bind($('#l-res'));
      }
      $('#l-go').onclick = search;
      $('#l-q').onkeydown = function (e) { if (e.key === 'Enter') search(); };
    }, function (e) { A.fail(el, e); });
  };

  function detail(el, c, trail) {
    A.top({ back: function () { if (trail.length) { var t = trail.slice(0, -1); A.go('links', { c: trail[trail.length - 1], trail: t }); } else A.go('links'); }, title: 'เชื่อมโยง · ' + c });
    A.loading(el, 'กำลังโหลด…');
    A.loadFam().then(function (F) {
      var f = F[c];

      var comps = f.comps;
      el.innerHTML = (trail.length ? '<div class="chips">' + trail.concat([c]).map(function (x, k) { return '<button class="chip ' + (x === c ? 'on' : '') + '" data-tr="' + k + '"><span class="han">' + esc(x) + '</span></button>' + (k < trail.length ? '<span class="muted" style="align-self:center">→</span>' : ''); }).join('') + '</div>' : '') +
        '<div class="card fam"><div class="fam-h"><div class="big">' + esc(f.c) + '</div><div style="flex:1;min-width:0"><div style="font-size:22px">' + A.pyHtml(f.p) + '</div><div class="mean">แปลว่า: ' + esc(f.t) + ' ' + (f.em ? '<span class="em">' + f.em + '</span>' : '') + '</div><div class="small muted">' + esc(lvText(f.lv)) + '</div></div>' + A.sayBtn(f.c) + '</div>' +
        (comps.length ? '<div class="sec" style="margin:18px 0 6px"><h2>คำที่ต่อยอดจาก <span class="han">' + esc(f.c) + '</span></h2><span class="small muted">' + comps.length + ' คำ</span></div><div class="fam-list">' +
          comps.map(function (w) {
            var parts = Array.from(w.h).map(function (x) { var pf = F[x]; return { c: x, t: g1(pf) || x }; });
            return '<div class="fl"><span class="arrow">→</span><div class="tx"><div class="eq"><span class="w">' + esc(w.h) + '</span> (' + A.pyHtml(w.p) + ') = <b>' + esc(w.t) + '</b> <span class="muted">(' + esc(parts.map(function (p) { return p.t; }).join(' + ')) + ')</span></div>' +
              '<div class="bd">' + parts.map(function (p) { return '<button class="bdc' + (p.c === c ? ' self' : '') + '" data-c="' + esc(p.c) + '"><span class="han">' + esc(p.c) + '</span>' + esc(p.t) + '</button>'; }).join('') + '</div></div>' + A.sayBtn(w.h, 'sm') + '</div>';
          }).join('') + '</div>' : '<p class="muted mt">ยังไม่มีคำต่อยอดในคลัง HSK</p>') +
        '</div>' +
        '<div class="btns two"><button class="btn ghost" id="fd-wr">✍️ ฝึกเขียน ' + esc(c) + '</button><button class="btn ghost" id="fd-sp"' + (comps.length ? '' : ' disabled') + '>🎤 พูดตามคำในกลุ่ม</button></div>' +
        '<div class="note">💡 แตะตัวอักษรในวงเล็บ (เช่น <span class="han">车</span>) เพื่อไปต่อยอดจากตัวนั้น — เรียนเป็นเครือข่ายจำได้นานกว่าท่องทีละคำ</div>';
      $$('.bdc', el).forEach(function (b) { b.onclick = function () { var x = b.dataset.c; if (x === c) return; A.go('links', { c: x, trail: trail.concat([c]) }); }; });
      $$('[data-tr]', el).forEach(function (b) { b.onclick = function () { var k = +b.dataset.tr, all = trail.concat([c]); if (all[k] === c) return; A.go('links', { c: all[k], trail: all.slice(0, k) }); }; });
      $('#fd-wr').onclick = function () { A.go('write', { chars: c + comps.slice(0, 3).map(function (w) { return w.h; }).join('') }); };
      var sp = $('#fd-sp'); if (comps.length) sp.onclick = function () { A.go('speakrun', { kind: 'list', items: [{ zh: f.c, py: f.p, th: f.t }].concat(comps.map(function (w) { return { zh: w.h, py: w.p, th: w.t }; })), backp: { v: 'links', c: c, trail: trail } }); };
      A.TTS.speak(f.c);
      A.touch();
    }, function (e) { A.fail(el, e); });
  }
})();

/* Install as an app (PWA) + offline download */
(function () {
  'use strict';
  var A = window.APP, $ = A.$, esc = A.esc;
  var IN_GAS = !!(window.google && google.script && google.script.run) || /googleusercontent\.com$|script\.google\.com$/.test(location.hostname);
  var WEB = location.protocol === 'https:' || location.hostname === 'localhost';
  var STANDALONE = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var deferred = null;
  var APP_URL = (window.CONFIG && CONFIG.ALT_URL) || '';

  if (WEB && !IN_GAS && 'serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () { });
  }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; var b = $('#ins-btn'); if (b) b.classList.remove('hide'); });
  window.addEventListener('appinstalled', function () { deferred = null; A.toast('ติดตั้งแอปแล้ว ✓ เปิดได้จากหน้าจอโฮม'); });

  /* small banner on Home when the app can be installed */
  var homeOrig = A.V.home;
  A.V.home = function (el) {

    (function put() {
      if (A.R.v !== 'home' || el.querySelector('.insbar')) return;
      if (!el.querySelector('.hero') && tries++ < 40) { setTimeout(put, 150); return; }
      var div = document.createElement('div');
      div.className = 'insbar';
      div.innerHTML = '<span class="seal" style="flex:none">汉</span><div style="flex:1"><b>ติดตั้งเป็นแอป</b><span>เปิดจากหน้าจอโฮม เต็มจอ ใช้ออฟไลน์ได้</span></div><button class="chip on" id="ib-go">ติดตั้ง</button><button class="ibtn" id="ib-x" aria-label="ปิด">✕</button>';
      el.insertBefore(div, el.firstChild);
      $('#ib-go').onclick = function () {
        if (deferred) { deferred.prompt(); deferred.userChoice.then(function () { deferred = null; }); }
        else A.go('settings');
      };
      $('#ib-x').onclick = function () { A.S.insHide = true; A.save(); div.remove(); };
    })();
  };

  A.installUI = function (box) {
    var html = '<div class="sec"><h2>ติดตั้งเป็นแอป</h2></div><div class="card">';
    if (STANDALONE) {
      html += '<p style="margin:0"><b>✓ กำลังใช้งานแบบแอปอยู่</b></p><p class="small muted" style="margin:4px 0 12px">ดาวน์โหลดคำศัพท์ไว้ในเครื่องเพื่อใช้ตอนไม่มีเน็ตได้</p>';
    } else if (IN_GAS) {
      html += '<p class="small" style="margin:0 0 10px">เวอร์ชันนี้เปิดผ่าน Google Apps Script ติดตั้งเป็นแอปเต็มรูปแบบไม่ได้ ' +
        (APP_URL ? 'ให้เปิดลิงก์นี้แล้วกดติดตั้ง:<br><a href="' + esc(APP_URL) + '" target="_blank" rel="noopener" style="color:var(--red);font-weight:600;word-break:break-all">' + esc(APP_URL) + '</a>' : '') +
        '</p><p class="small muted" style="margin:0">หรือกด ⋮ / แชร์ → "เพิ่มไปยังหน้าจอหลัก" เพื่อสร้างทางลัด</p></div>';
      box.innerHTML = html; return;

      html += '<p style="margin:0 0 8px"><b>iPhone / iPad</b> (ใช้ Safari)</p><ol class="small" style="margin:0 0 12px;padding-left:20px"><li>แตะปุ่ม <b>แชร์</b> ⬆️ ด้านล่าง</li><li>เลือก <b>"เพิ่มไปยังหน้าจอโฮม"</b></li><li>แตะ <b>เพิ่ม</b> — ไอคอน 汉 จะอยู่บนหน้าจอเหมือนแอป</li></ol>';
    } else {
      html += '<p class="small" style="margin:0 0 10px">ติดตั้งแล้วเปิดจากไอคอนบนหน้าจอ เต็มจอเหมือนแอป ไม่ต้องเปิดเบราว์เซอร์</p>' +
        '<button class="btn' + (deferred ? '' : ' hide') + '" id="ins-btn">📲 ติดตั้งแอป</button>' +
        '<p class="small muted" id="ins-alt" style="margin:8px 0 0">ถ้าไม่มีปุ่มติดตั้ง: กด ⋮ ที่มุมเบราว์เซอร์ → <b>"ติดตั้งแอป"</b> หรือ <b>"เพิ่มไปยังหน้าจอหลัก"</b></p>';
    }
    html += '<div class="btns" style="margin-top:12px"><button class="btn ghost" id="ins-dl">⬇️ ดาวน์โหลดคำศัพท์ทุกระดับไว้ใช้ออฟไลน์ (~3 MB)</button></div><p class="small muted" id="ins-st" style="margin:6px 0 0"></p></div>';
    box.innerHTML = html;
    var b = $('#ins-btn');
    if (b) b.onclick = function () {
      if (!deferred) { A.toast('กด ⋮ → ติดตั้งแอป'); return; }
      deferred.prompt(); deferred.userChoice.then(function () { deferred = null; b.classList.add('hide'); });
    };
    $('#ins-dl').onclick = function () {
      var keys = ['t1', 't2', 't3', 't4', 't5', 't6', 't7', 'o1', 'o2', 'o3', 'o4', 'o5', 'o6', 'fam'], done = 0, st = $('#ins-st'), btn = this;
      btn.disabled = true;
      var next = function () {
        if (!keys.length) { st.textContent = '✓ ดาวน์โหลดครบ ' + done + ' ชุด ใช้งานออฟไลน์ได้แล้ว (เสียงอ่านและลำดับขีดจะเก็บไว้เมื่อเปิดดูครั้งแรก)'; btn.disabled = false; return; }
        var k = keys.shift();

    };
  };
})();
